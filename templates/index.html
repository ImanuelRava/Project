<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB Pro Analyst</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --bg-input: rgba(51, 65, 85, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Interactive Canvas Background */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* Header & Nav */
        header {
            background: var(--bg-card);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(12px);
        }
        
        .brand-container {
            display: flex;
            flex-direction: column;
        }

        h1 { 
            font-size: 1.25rem; 
            font-weight: 700; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            margin-bottom: 2px;
        }
        .logo-icon { width: 24px; height: 24px; background: linear-gradient(135deg, var(--accent-blue), var(--accent-red)); border-radius: 6px; }
        .creator-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            padding-left: 34px;
        }
        
        nav { display: flex; gap: 1rem; }
        button.tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.5rem 1rem;
            font-weight: 600;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        button.tab-btn.active { color: var(--text-main); border-bottom-color: var(--accent-blue); }
        button.tab-btn:hover { color: var(--text-main); }

        main { flex: 1; padding: 2rem; max-width: 1400px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; position: relative; z-index: 5; }

        /* Sections */
        .section { display: none; animation: fadeIn 0.3s ease; flex: 1; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- ANALYZER STYLES --- */
        .analyzer-grid {
            display: grid;
            grid-template-columns: 1fr 350px 1fr;
            gap: 2rem;
            align-items: start;
        }

        .team-column {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            min-height: 500px;
        }

        .team-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .team-title { font-size: 1.2rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .blue-text { color: var(--accent-blue); }
        .red-text { color: var(--accent-red); }

        .hero-list { display: flex; flex-direction: column; gap: 0.75rem; }
        
        .hero-card {
            display: flex;
            align-items: center;
            background: var(--bg-input);
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
            backdrop-filter: blur(5px);
            border: 1px solid transparent;
        }
        .hero-card:hover { transform: translateX(5px); border-color: rgba(255,255,255,0.2); }
        
        .hero-avatar {
            width: 40px; height: 40px; border-radius: 6px; margin-right: 12px;
            background-color: rgba(71, 85, 105, 0.8); display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.2rem; text-transform: uppercase;
        }
        .hero-card img { width: 40px; height: 40px; border-radius: 6px; margin-right: 12px; object-fit: cover; background: #000; }
        
        .hero-info h4 { font-size: 0.95rem; margin-bottom: 2px; }
        .hero-info p { font-size: 0.75rem; color: var(--text-muted); }
        .remove-btn {
            margin-left: auto;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0 0.5rem;
        }
        .remove-btn:hover { color: var(--accent-red); }

        .add-hero-btn {
            width: 100%;
            padding: 1rem;
            margin-top: 1rem;
            background: var(--bg-input);
            border: 1px dashed var(--border);
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
        }
        .add-hero-btn:hover { border-color: var(--text-main); color: var(--text-main); background: rgba(255,255,255,0.05); }

        .analysis-panel {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            position: sticky;
            top: 2rem;
        }

        .chart-container {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: center;
            /* Flex layout to center the SVG */
        }
        
        .stat-box {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
        }
        
        /* Win Rate Bar Styles */
        .winrate-container {
            display: none;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .prob-display-text {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .progress-bar-track {
            width: 100%;
            height: 24px;
            background-color: rgba(0,0,0,0.3);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }

        .progress-gradient {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-blue) 50%, var(--accent-red) 50%);
            transition: background 0.5s ease;
        }

        .advantage-list { text-align: left; margin-top: 1rem; font-size: 0.9rem; }
        .advantage-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .suggestion-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }

        .btn-reset {
            width: 100%;
            padding: 0.8rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-reset:hover {
            background: var(--accent-red);
            color: white;
        }

        /* --- STATS TABLE STYLES --- */
        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            align-items: center;
        }

        select {
            background: var(--bg-input);
            backdrop-filter: blur(5px);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            outline: none;
            min-width: 150px;
        }

        .table-container {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow-x: auto;
        }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: rgba(0,0,0,0.2); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; user-select: none; }
        th:hover { background: rgba(255,255,255,0.05); }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        
        .win-rate-high { color: var(--accent-green); font-weight: bold; }
        .win-rate-low { color: var(--accent-red); font-weight: bold; }

        .stat-hero-cell {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
        }
        .stat-hero-img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border);
        }
        .phase-cell {
            text-align: center;
            font-family: monospace;
            font-size: 0.9rem;
        }

        /* --- MATCH VIEWER STYLES --- */
        .match-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
        
        .match-card {
            background: var(--bg-card); 
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 8px; 
            overflow: hidden; 
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
            position: relative;
        }

        .match-card:hover { 
            transform: translateY(-3px); 
            border-color: var(--text-muted); 
        }

        .match-header {
            padding: 0.75rem 1rem; 
            background: rgba(0,0,0,0.2);
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            font-size: 0.85rem; 
            color: var(--text-muted);
        }

        .chevron {
            transition: transform 0.3s ease;
            font-size: 1.2rem;
        }
        .match-card.active .chevron {
            transform: rotate(180deg);
        }

        .match-body { padding: 1rem; }
        
        .team-score { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 0.8rem; 
            font-weight: 700; 
        }
        .winner { color: var(--accent-green); }
        .loser { color: var(--text-muted); opacity: 0.7; }

        .phase-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
            letter-spacing: 0.05em;
        }

        .draft-preview { 
            display: flex; 
            gap: 4px; 
            margin-top: 0.5rem; 
            justify-content: space-between;
        }
        
        .mini-icon {
            width: 32px; 
            height: 32px; 
            background: var(--bg-input);
            border-radius: 6px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 0.6rem; 
            overflow: hidden;
            border: 1px solid transparent;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .match-card:hover .mini-icon {
            border-color: var(--border);
        }
        .mini-icon img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        .mini-icon.ban-blue { border: 2px solid var(--accent-blue); }
        .mini-icon.ban-red { border: 2px solid var(--accent-red); }

        .match-bans {
            display: none;
            background: rgba(0,0,0,0.15);
            padding: 1rem;
            border-top: 1px solid var(--border);
        }
        .match-bans.open {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ban-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }
        .ban-row:last-child { margin-bottom: 0; }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: center;
            z-index: 1000; backdrop-filter: blur(4px);
        }
        .modal {
            background: var(--bg-card); backdrop-filter: blur(12px); width: 90%; max-width: 600px; max-height: 80vh;
            border-radius: 12px; border: 1px solid var(--border);
            display: flex; flex-direction: column;
        }
        .modal-header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-search {
            width: 100%; background: var(--bg-input); border: 1px solid var(--border);
            color: var(--text-main); padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem;
        }
        .hero-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 0.5rem; padding: 0 1.5rem 1.5rem; overflow-y: auto;
        }
        .grid-item {
            background: var(--bg-input); border: 1px solid transparent;
            border-radius: 6px; cursor: pointer; text-align: center; padding: 0.5rem;
            transition: all 0.2s;
        }
        .grid-item:hover { border-color: var(--accent-blue); background: var(--bg-card); }
        .grid-item img { width: 40px; height: 40px; border-radius: 4px; margin-bottom: 4px; object-fit: cover; }
        .grid-item span { display: block; font-size: 0.7rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .loading { text-align: center; padding: 2rem; color: var(--text-muted); }
        .error { text-align: center; padding: 2rem; color: var(--accent-red); border: 1px solid var(--accent-red); border-radius: 8px; margin-bottom: 1rem; }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<header>
    <div class="brand-container">
        <h1>
            <div class="logo-icon"></div>
            MLBB Pro Analyst
        </h1>
        <p class="creator-text">Created by Imanuel Rava</p>
    </div>
    <nav>
        <button class="tab-btn active" data-tab="analyzer" onclick="switchTab('analyzer')">Comp Analyzer</button>
        <button class="tab-btn" data-tab="stats" onclick="switchTab('stats')">Hero Statistics</button>
        <button class="tab-btn" data-tab="database" onclick="switchTab('database')">Tournament Data</button>
    </nav>
</header>

<main>
    <!-- ANALYZER SECTION -->
    <section id="analyzer" class="section active">
        <div class="analyzer-grid">
            <!-- Blue Team -->
            <div class="team-column">
                <div class="team-header">
                    <span class="team-title blue-text">Blue Team</span>
                    <span id="blue-count">0/5</span>
                </div>
                <div id="blue-list" class="hero-list"></div>
                <button class="add-hero-btn" onclick="openModal('blue')">+ Add Hero</button>
            </div>

            <!-- Analysis -->
            <div class="analysis-panel">
                <button class="btn-reset" onclick="resetDraft()">↺ Reset Draft</button>

                <div class="chart-container" id="radar-chart"></div>
                
                <div class="stat-box">
                    <!-- New Winrate Container -->
                    <div id="winrate-container" class="winrate-container">
                        <div class="prob-display-text">
                            <span class="blue-text" id="blue-prob-text">0.00%</span>
                            <span class="red-text" id="red-prob-text">0.00%</span>
                        </div>
                        <div class="progress-bar-track">
                            <div class="progress-gradient" id="bar-gradient"></div>
                        </div>
                    </div>

                    <div id="advantages" class="advantage-list"></div>
                </div>
                <div id="suggestion" class="suggestion-box">
                    <strong>Suggestion:</strong> <span id="suggestion-text"></span>
                </div>
            </div>

            <!-- Red Team -->
            <div class="team-column">
                <div class="team-header">
                    <span class="team-title red-text">Red Team</span>
                    <span id="red-count">0/5</span>
                </div>
                <div id="red-list" class="hero-list"></div>
                <button class="add-hero-btn" onclick="openModal('red')">+ Add Hero</button>
            </div>
        </div>
    </section>

    <!-- STATS SECTION -->
    <section id="stats" class="section">
        <div class="filters">
            <div>
                <label style="font-size:0.8rem; color:var(--text-muted); display:block; margin-bottom:4px;">Tournament</label>
                <select id="stats-tournament" onchange="loadStatsTable()"></select>
            </div>
            <div>
                <label style="font-size:0.8rem; color:var(--text-muted); display:block; margin-bottom:4px;">Map</label>
                <select id="stats-map" onchange="loadStatsTable()"></select>
            </div>
            <div>
                <label style="font-size:0.8rem; color:var(--text-muted); display:block; margin-bottom:4px;">Side</label>
                <select id="stats-side" onchange="loadStatsTable()">
                    <option value="Blue">Blue Side</option>
                    <option value="Red">Red Side</option>
                </select>
            </div>
             <div>
                <label style="font-size:0.8rem; color:var(--text-muted); display:block; margin-bottom:4px;">Sort By</label>
                <select id="stats-sort" onchange="loadStatsTable()">
                    <option value="Total Picks">Total Picks</option>
                    <option value="Pick P1">Pick P1</option>
                    <option value="Pick P2">Pick P2</option>
                    <option value="Ban P1">Ban P1</option>
                    <option value="Ban P2">Ban P2</option>
                    <option value="Win Rate">Win Rate</option>
                </select>
            </div>
        </div>

        <div class="table-container">
            <table id="stats-table">
                <thead>
                    <tr>
                        <th>Hero</th>
                        <th style="text-align:center">Pick P1</th>
                        <th style="text-align:center">Pick P2</th>
                        <th style="text-align:center">Ban P1</th>
                        <th style="text-align:center">Ban P2</th>
                        <th style="text-align:center">Total Picks</th>
                        <th style="text-align:center">Win Rate</th>
                    </tr>
                </thead>
                <tbody id="stats-body">
                    <tr><td colspan="7" class="loading">Loading statistics...</td></tr>
                </tbody>
            </table>
        </div>
    </section>

    <!-- DATABASE SECTION -->
    <section id="database" class="section">
        <div class="filters">
            <select id="match-tournament" onchange="renderMatches()">
                <option value="All">All Tournaments</option>
            </select>
            <select id="match-map" onchange="renderMatches()">
                <option value="All">All Maps</option>
            </select>
            <select id="match-team" onchange="renderMatches()">
                <option value="All">All Teams</option>
            </select>
        </div>
        <div id="match-list" class="match-grid">
            <div class="loading">Loading matches...</div>
        </div>
    </section>
</main>

<!-- HERO SELECTION MODAL -->
<div class="modal-overlay" id="hero-modal">
    <div class="modal">
        <div class="modal-header">
            <h3>Select a Hero</h3>
            <button class="remove-btn" onclick="closeModal()">✕</button>
        </div>
        <input type="text" class="modal-search" id="hero-search" placeholder="Search hero name..." onkeyup="filterHeroes()">
        <div class="hero-grid" id="hero-grid"></div>
    </div>
</div>

<script>
    let state = {
        heroData: {},      
        matches: [],       
        filters: {},       
        blueTeam: [],
        redTeam: [],
        currentModalSide: null,
        isApiConnected: false
    };

    const API_BASE = 'http://localhost:8000/api';

    window.addEventListener('DOMContentLoaded', async () => {
        await checkConnection();
        if (state.isApiConnected) {
            await Promise.all([loadHeroData(), loadMatches(), loadFilters()]);
            renderChart(); 
        }
    });

    async function checkConnection() {
        try {
            const res = await fetch(`${API_BASE}/heroes`);
            if (res.ok) {
                state.isApiConnected = true;
            } else {
                throw new Error('API Error');
            }
        } catch (e) {
            document.querySelector('main').innerHTML = 
                `<div class="error">Cannot connect to Backend.<br>Please run <code>python flask_app.py</code> in the terminal.</div>`;
        }
    }

    function switchTab(tabId) {
        document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');

        document.querySelectorAll('.tab-btn').forEach(btn => {
            if (btn.getAttribute('data-tab') === tabId) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        
        if (tabId === 'stats') loadStatsTable();
    }

    // --- DATA FETCHING ---

    async function loadHeroData() {
        const res = await fetch(`${API_BASE}/heroes`);
        state.heroData = await res.json();
        initHeroGrid();
    }

    async function loadMatches() {
        const res = await fetch(`${API_BASE}/matches`);
        state.matches = await res.json();
        populateMatchFilters();
        renderMatches();
    }

    async function loadFilters() {
        const res = await fetch(`${API_BASE}/filters?tournament=All`);
        state.filters = await res.json();
        populateStatsFilters();
    }

    async function loadStatsTable() {
        if (!state.isApiConnected) return;

        const tbody = document.getElementById('stats-body');
        tbody.innerHTML = '<tr><td colspan="7" class="loading">Calculating stats...</td></tr>';

        const tournament = document.getElementById('stats-tournament').value;
        const map = document.getElementById('stats-map').value;
        const side = document.getElementById('stats-side').value;
        const sortBy = document.getElementById('stats-sort').value;

        const url = `${API_BASE}/tournament-stats?tournament=${tournament}&map=${map}&side=${side}&sort=${sortBy}`;
        
        try {
            const res = await fetch(url);
            const data = await res.json();
            renderStatsTable(data);
        } catch (e) {
            tbody.innerHTML = '<tr><td colspan="7" class="error">Error loading stats</td></tr>';
        }
    }

    // --- RENDERING LOGIC ---

    function populateStatsFilters() {
        const tSelect = document.getElementById('stats-tournament');
        const mSelect = document.getElementById('stats-map');
        
        tSelect.innerHTML = '';
        mSelect.innerHTML = '';

        if (state.filters.tournaments.length > 0) {
            state.filters.tournaments.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t; opt.innerText = t;
                tSelect.appendChild(opt);
            });
            tSelect.selectedIndex = 0; 
        }

        if (state.filters.maps.length > 0) {
            state.filters.maps.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m; opt.innerText = m;
                mSelect.appendChild(opt);
            });
            mSelect.selectedIndex = 0; 
        }

        loadStatsTable();
    }

    function renderStatsTable(data) {
        const tbody = document.getElementById('stats-body');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:var(--text-muted)">No data available for these filters.</td></tr>';
            return;
        }

        data.forEach(row => {
            const tr = document.createElement('tr');
            
            const heroInfo = state.heroData[row.Hero] || { roles: ['Unknown'] };
            const roleStr = heroInfo.roles.join(', ');
            const imgPath = `/static/hero_icon/${encodeURIComponent(row['Hero'])}.png`;
            const wrClass = row['Win Rate'] >= 60 ? 'win-rate-high' : (row['Win Rate'] <= 40 ? 'win-rate-low' : '');

            tr.innerHTML = `
                <td>
                    <div class="stat-hero-cell">
                        <img src="${imgPath}" class="stat-hero-img" onerror="this.style.display='none'">
                        <div>
                            <div style="font-weight:700">${row.Hero}</div>
                            <div style="font-size:0.75rem; color:var(--text-muted)">${roleStr}</div>
                        </div>
                    </div>
                </td>
                <td class="phase-cell">${row['Pick P1']}</td>
                <td class="phase-cell">${row['Pick P2']}</td>
                <td class="phase-cell" style="color:var(--accent-red)">${row['Ban P1']}</td>
                <td class="phase-cell" style="color:var(--accent-red)">${row['Ban P2']}</td>
                <td class="phase-cell" style="font-weight:bold">${row['Total Picks']}</td>
                <td class="phase-cell ${wrClass}">${row['Win Rate'].toFixed(1)}%</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function populateMatchFilters() {
        const tSet = new Set(state.matches.map(m => m.tournament));
        const mSet = new Set(state.matches.map(m => m.map));
        const tmSet = new Set(state.matches.flatMap(m => [m.blue_team, m.red_team]));

        const fill = (id, set) => {
            const el = document.getElementById(id);
            while(el.options.length > 1) el.remove(1);
            set.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v; opt.innerText = v;
                el.appendChild(opt);
            });
        };

        fill('match-tournament', tSet);
        fill('match-map', mSet);
        fill('match-team', tmSet);
    }

    const renderIcon = (hero, className = '') => {
        if (!hero) return '';
        const path = `/static/hero_icon/${encodeURIComponent(hero)}.png`;
        return `<div class="mini-icon ${className}" title="${hero}"><img src="${path}" onerror="this.style.display='none'; this.parentElement.innerText='${hero.charAt(0)}'"></div>`;
    };

    const renderIcons = (heroes) => {
        if (!heroes || heroes.length === 0) return '';
        return heroes.map(p => renderIcon(p)).join('');
    };

    function toggleMatchBans(card) {
        card.classList.toggle('active');
        const bansDiv = card.querySelector('.match-bans');
        if (bansDiv) {
            bansDiv.classList.toggle('open');
        }
    }

    function renderMatches() {
        const tFilter = document.getElementById('match-tournament').value;
        const mFilter = document.getElementById('match-map').value;
        const tmFilter = document.getElementById('match-team').value;

        const filtered = state.matches.filter(m => {
            return (tFilter === "All" || m.tournament === tFilter) &&
                   (mFilter === "All" || m.map === mFilter) &&
                   (tmFilter === "All" || m.blue_team === tmFilter || m.red_team === tmFilter);
        });

        const container = document.getElementById('match-list');
        container.innerHTML = '';

        if (filtered.length === 0) {
            container.innerHTML = '<div class="status-msg">No matches found.</div>';
            return;
        }

        filtered.forEach(m => {
            const card = document.createElement('div');
            card.className = 'match-card';
            card.onclick = (e) => {
                toggleMatchBans(card);
            };

            const blueClass = m.blue_result === 'WIN' ? 'winner' : 'loser';
            const redClass = m.red_result === 'WIN' ? 'winner' : 'loser';

            const bluePicks = [...(m.blue_picks_p1 || []), ...(m.blue_picks_p2 || [])];
            const redPicks = [...(m.red_picks_p1 || []), ...(m.red_picks_p2 || [])];

            const blueBans = [...(m.blue_bans_p1 || []), ...(m.blue_bans_p2 || [])];
            const redBans = [...(m.red_bans_p1 || []), ...(m.red_bans_p2 || [])];

            card.innerHTML = `
                <div class="match-header">
                    <span>${m.tournament} • ${m.map}</span>
                    <span class="chevron">▼</span>
                </div>
                <div class="match-body">
                    <div class="team-score ${blueClass}">
                        <span>${m.blue_team}</span><span>${m.blue_result}</span>
                    </div>
                    <div class="draft-preview">
                        ${renderIcons(bluePicks)}
                    </div>
                    <div style="height:1px; background:rgba(255,255,255,0.1); margin: 0.8rem 0;"></div>
                    <div class="team-score ${redClass}">
                        <span>${m.red_team}</span><span>${m.red_result}</span>
                    </div>
                    <div class="draft-preview">
                        ${renderIcons(redPicks)}
                    </div>
                </div>
                
                <div class="match-bans">
                    <div class="phase-label">Bans</div>
                    <div class="ban-row">
                        <div class="draft-preview" style="flex:1">
                            ${blueBans.map(p => renderIcon(p, 'ban-blue')).join('')}
                        </div>
                        <div class="draft-preview" style="flex:1; justify-content:flex-end;">
                            ${redBans.map(p => renderIcon(p, 'ban-red')).join('')}
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // --- COMP ANALYZER LOGIC ---

    function initHeroGrid() {
        const grid = document.getElementById('hero-grid');
        grid.innerHTML = '';
        Object.keys(state.heroData).forEach(hero => {
            const div = document.createElement('div');
            div.className = 'grid-item';
            div.dataset.name = hero;
            const initial = hero.charAt(0);
            const imgUrl = state.heroData[hero].image || '';
            
            div.innerHTML = `
                ${imgUrl ? `<img src="${imgUrl}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                            <div class="hero-avatar" style="display:none; width:40px; height:40px;">${initial}</div>` 
                          : `<div class="hero-avatar" style="width:40px; height:40px;">${initial}</div>`}
                <span>${hero}</span>
            `;
            div.onclick = () => selectHero(hero);
            grid.appendChild(div);
        });
    }

    function openModal(side) {
        state.currentModalSide = side;
        document.getElementById('hero-modal').style.display = 'flex';
        document.getElementById('hero-search').value = '';
        filterHeroes();
    }

    function closeModal() {
        document.getElementById('hero-modal').style.display = 'none';
    }

    function filterHeroes() {
        const query = document.getElementById('hero-search').value.toLowerCase();
        const items = document.querySelectorAll('.grid-item');
        items.forEach(item => {
            const name = item.dataset.name.toLowerCase();
            item.style.display = name.includes(query) ? 'block' : 'none';
        });
    }

    function selectHero(heroName) {
        if (state.blueTeam.includes(heroName) || state.redTeam.includes(heroName)) {
            alert(`Hero ${heroName} has already been picked!`);
            return;
        }

        if (state.currentModalSide === 'blue') {
            if (state.blueTeam.length < 5) state.blueTeam.push(heroName);
        } else {
            if (state.redTeam.length < 5) state.redTeam.push(heroName);
        }
        closeModal();
        renderTeams();
        renderChart();
        calculateAnalysis();
    }

    function removeHero(side, index) {
        if (side === 'blue') state.blueTeam.splice(index, 1);
        else state.redTeam.splice(index, 1);
        renderTeams();
        renderChart();
        calculateAnalysis();
    }

    function renderTeams() {
        const renderList = (team, side) => {
            const container = document.getElementById(`${side}-list`);
            container.innerHTML = '';
            team.forEach((hero, idx) => {
                const card = document.createElement('div');
                card.className = 'hero-card';
                const initial = hero.charAt(0);
                const imgUrl = state.heroData[hero]?.image;
                
                card.innerHTML = `
                    ${imgUrl ? `<img src="${imgUrl}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                                <div class="hero-avatar" style="display:none">${initial}</div>` 
                              : `<div class="hero-avatar">${initial}</div>`}
                    <div class="hero-info">
                        <h4>${hero}</h4>
                        <p>${state.heroData[hero] ? state.heroData[hero].roles[0] : 'Unknown'}</p>
                    </div>
                    <button class="remove-btn" onclick="event.stopPropagation(); removeHero('${side}', ${idx})">✕</button>
                `;
                container.appendChild(card);
            });
            document.getElementById(`${side}-count`).innerText = `${team.length}/5`;
        };

        renderList(state.blueTeam, 'blue');
        renderList(state.redTeam, 'red');
    }

    function resetDraft() {
        state.blueTeam = [];
        state.redTeam = [];
        renderTeams();
        renderChart();
        calculateAnalysis();
    }

    // --- MATH & CHART ---

    function calculateStats(teamList) {
        const categories = ['Durability', 'Offense', 'Crowd Control', 'Mobility', 'Wave Control'];
        const stats = {};
        categories.forEach(cat => stats[cat] = 0);

        if (teamList.length === 0) return stats;

        categories.forEach(cat => {
            const values = teamList.map(h => state.heroData[h] ? state.heroData[h].stats[cat] : 0);
            if (values.length === 0) { stats[cat] = 0; return; }

            const maxVal = Math.max(...values);
            const totalSum = values.reduce((a, b) => a + b, 0);
            const countOthers = values.length - 1;
            const avgOthers = countOthers > 0 ? (totalSum - maxVal) / countOthers : 0;

            stats[cat] = (maxVal * 0.7) + (avgOthers * 0.3);
        });
        return stats;
    }

    // [2] RENDER BUTTERFLY CHART (Tornado Chart)
    function renderChart() {
        const blueStats = calculateStats(state.blueTeam);
        const redStats = calculateStats(state.redTeam);
        const container = document.getElementById('radar-chart');
        
        // Butterfly Chart Config
        const width = 300;
        const height = 220;
        const center = width / 2;
        const barHeight = 20;
        const rowGap = 15; // Gap between bars vertically
        const maxBarWidth = 100; // Represents stat 10
        
        const categories = ['Durability', 'Offense', 'Crowd Control', 'Mobility', 'Wave Control'];
        const emojiMap = {
            'Durability': '🛡️',
            'Offense': '⚔️',
            'Crowd Control': '⚡',
            'Mobility': '🏃',
            'Wave Control': '🧠'
        };

        let svgHtml = '';

        // Center line
        svgHtml += `<line x1="${center}" y1="10" x2="${center}" y2="${height}" stroke="#334155" stroke-width="1" stroke-dasharray="4"/>`;

        categories.forEach((cat, i) => {
            const y = 30 + (i * (barHeight + rowGap));
            const bVal = blueStats[cat];
            const rVal = redStats[cat];

            // Calculate widths based on max stat 10
            const bWidth = (bVal / 10) * maxBarWidth;
            const rWidth = (rVal / 10) * maxBarWidth;

            // Blue Bar (Left side)
            const bX = center - bWidth;
            // Red Bar (Right side)
            
            // Label (Above)
            svgHtml += `<text x="${center}" y="${y - 5}" fill="#cbd5e1" font-size="12" text-anchor="middle" font-weight="600">${emojiMap[cat] || ''} ${cat}</text>`;

            // Draw Blue Bar
            svgHtml += `<rect x="${bX}" y="${y}" width="${bWidth}" height="${barHeight}" fill="var(--accent-blue)" rx="4" />`;
            // Draw Red Bar
            svgHtml += `<rect x="${center}" y="${y}" width="${rWidth}" height="${barHeight}" fill="var(--accent-red)" rx="4" />`;

            // Values
            // Blue Value Text (Left of bar)
            if (bVal > 0) {
                svgHtml += `<text x="${bX - 5}" y="${y + 14}" fill="#60a5fa" font-size="10" text-anchor="end" font-family="monospace">${bVal.toFixed(1)}</text>`;
            }
            // Red Value Text (Right of bar)
            if (rVal > 0) {
                svgHtml += `<text x="${center + rWidth + 5}" y="${y + 14}" fill="#f87171" font-size="10" text-anchor="start" font-family="monospace">${rVal.toFixed(1)}</text>`;
            }
        });

        const svg = `
            <svg width="100%" height="100%" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">
                ${svgHtml}
            </svg>
        `;
        container.innerHTML = svg;
    }

    function calculateAnalysis() {
        const blueStats = calculateStats(state.blueTeam);
        const redStats = calculateStats(state.redTeam);

        const blueTotal = Object.values(blueStats).reduce((a, b) => a + b, 0);
        const redTotal = Object.values(redStats).reduce((a, b) => a + b, 0);
        const total = blueTotal + redTotal || 1;

        const blueProb = (blueTotal / total) * 100;
        const redProb = 100 - blueProb;

        const winrateContainer = document.getElementById('winrate-container');
        if (state.blueTeam.length === 0 && state.redTeam.length === 0) {
            winrateContainer.style.display = 'none';
        } else {
            winrateContainer.style.display = 'flex';
            
            document.getElementById('blue-prob-text').innerText = blueProb.toFixed(2) + '%';
            document.getElementById('red-prob-text').innerText = redProb.toFixed(2) + '%';

            const gradientStop = blueProb.toFixed(1); 
            document.getElementById('bar-gradient').style.background = 
                `linear-gradient(90deg, var(--accent-blue) ${gradientStop}%, var(--accent-red) ${gradientStop}%)`;
        }

        // [1] Changed default text
        let advHtml = '';
        Object.keys(blueStats).forEach(key => {
            if (blueStats[key] > redStats[key]) {
                advHtml += `<div class="advantage-item"><span class="blue-text">${key}</span> <span>Blue +${(blueStats[key]-redStats[key]).toFixed(1)}</span></div>`;
            } else if (redStats[key] > blueStats[key]) {
                advHtml += `<div class="advantage-item"><span class="red-text">${key}</span> <span>Red +${(redStats[key]-blueStats[key]).toFixed(1)}</span></div>`;
            }
        });

        // If no advantages are calculated (teams are empty or perfectly equal), and specifically if no heroes are picked
        if (!advHtml && (state.blueTeam.length === 0 && state.redTeam.length === 0)) {
            document.getElementById('advantages').innerHTML = '<div style="text-align:center; color:var(--text-muted);">No heroes being picked</div>';
        } else if (!advHtml) {
             document.getElementById('advantages').innerHTML = '<div style="text-align:center; color:var(--text-muted);">Teams are balanced.</div>';
        } else {
            document.getElementById('advantages').innerHTML = advHtml;
        }

        const side = state.blueTeam.length <= state.redTeam.length ? 'blue' : 'red';
        const myStats = side === 'blue' ? blueStats : redStats;
        const weakest = Object.keys(myStats).reduce((a, b) => myStats[a] < myStats[b] ? a : b);
        
        const picked = new Set([...state.blueTeam, ...state.redTeam]);
        let bestHero = null; let maxScore = -1;
        
        Object.keys(state.heroData).forEach(h => {
            if (!picked.has(h)) {
                const score = state.heroData[h].stats[weakest];
                if (score > maxScore) { maxScore = score; bestHero = h; }
            }
        });

        const suggestBox = document.getElementById('suggestion');
        if (bestHero) {
            suggestBox.style.display = 'block';
            document.getElementById('suggestion-text').innerText = 
                `${side.toUpperCase()} team is weak in ${weakest}. Consider picking ${bestHero} (${state.heroData[bestHero].roles[0]}).`;
        } else {
            suggestBox.style.display = 'none';
        }
    }

    // --- INTERACTIVE BACKGROUND ANIMATION ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    
    let width, height;
    let particles = [];
    
    const mouse = {
        x: null,
        y: null,
        radius: 150
    };

    window.addEventListener('mousemove', (e) => {
        mouse.x = e.x;
        mouse.y = e.y;
    });

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        initParticles();
    }
    window.addEventListener('resize', resize);

    class Particle {
        constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 1;
            this.vy = (Math.random() - 0.5) * 1;
            this.size = Math.random() * 2 + 1;
            this.baseX = this.x;
            this.baseY = this.y;
            this.density = (Math.random() * 30) + 1;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;

            if (this.x < 0 || this.x > width) this.vx = -this.vx;
            if (this.y < 0 || this.y > height) this.vy = -this.vy;

            let dx = mouse.x - this.x;
            let dy = mouse.y - this.y;
            let distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance < mouse.radius) {
                const forceDirectionX = dx / distance;
                const forceDirectionY = dy / distance;
                const maxDistance = mouse.radius;
                const force = (maxDistance - distance) / maxDistance;
                const directionX = forceDirectionX * force * this.density;
                const directionY = forceDirectionY * force * this.density;
                
                this.x -= directionX;
                this.y -= directionY;
            } else {
                // Keep floating
            }
        }

        draw() {
            ctx.fillStyle = 'rgba(59, 130, 246, 0.5)'; 
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.closePath();
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        let numberOfParticles = (width * height) / 9000; 
        for (let i = 0; i < numberOfParticles; i++) {
            particles.push(new Particle());
        }
    }

    function connect() {
        let opacityValue = 1;
        for (let a = 0; a < particles.length; a++) {
            for (let b = a; b < particles.length; b++) {
                let dx = particles[a].x - particles[b].x;
                let dy = particles[a].y - particles[b].y;
                let distance = dx * dx + dy * dy;

                if (distance < (canvas.width / 7) * (canvas.height / 7)) {
                    opacityValue = 1 - (distance / 20000);
                    ctx.strokeStyle = 'rgba(59, 130, 246,' + opacityValue + ')';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(particles[a].x, particles[a].y);
                    ctx.lineTo(particles[b].x, particles[b].y);
                    ctx.stroke();
                }
            }
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        connect();
        requestAnimationFrame(animate);
    }

    resize();
    animate();

</script>
</body>
</html>
